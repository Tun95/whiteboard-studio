# Builds the Windows installer. UNTESTED so far: run it from the Actions tab (Run workflow) and read any error.
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install ./whiteboard-animator pyinstaller
      - name: Get FFmpeg (LGPL build)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unzipped
          New-Item -ItemType Directory -Force build\ffmpeg | Out-Null
          Copy-Item ffmpeg-unzipped\*\bin\ffmpeg.exe, ffmpeg-unzipped\*\bin\ffprobe.exe build\ffmpeg\
      - name: Build the app with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --name WhiteboardWaveStudio --onedir --console `
            --add-data "studio/static;studio/static" --add-data "studio/voice_kokoro.py;studio" `
            --collect-all whiteboard_animator --collect-all skimage --collect-all onnxruntime `
            run_studio.py
          Copy-Item build\ffmpeg dist\WhiteboardWaveStudio\ffmpeg -Recurse
          Copy-Item whiteboard-animator\LICENSE dist\WhiteboardWaveStudio\LICENSE-whiteboard-animator.txt
          Copy-Item THIRD-PARTY.md dist\WhiteboardWaveStudio\
      - name: Make the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: WhiteboardWaveStudio-Setup
          path: packaging/Output/*.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/*.exe
